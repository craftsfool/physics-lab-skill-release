name: Scan full history for credentials
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download and verify pinned scanner
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/physics-gitleaks"
          mkdir -p "$scanner_dir"
          cd "$scanner_dir"
          curl --fail --silent --show-error --location --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location --output checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          mv gitleaks.tar.gz gitleaks_8.30.1_linux_x64.tar.gz
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Scan every branch and tag without logging secret values
        shell: bash
        run: |
          "$RUNNER_TEMP/physics-gitleaks/gitleaks" git . --config .gitleaks.toml --redact=100 --no-banner --log-opts="--all --full-history"
